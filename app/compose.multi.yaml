# Multi-node variant on one machine: 3 Kafka brokers (KRaft) + Flink JobManager +
# 3 TaskManagers, topics with 3 partitions and RF 3, job parallelism 3.
# Kafka replication settings follow DSPF-BM operations-playground/flink-scripts/
# docker-compose-kafka.yaml; Flink settings are the same as compose.yaml except
# parallelism 3 and 1 GB per TaskManager (memory budget ~4.5 GB for the stand).
# Use: docker compose -f app/compose.multi.yaml up -d --wait   (Flink UI on :8082)
name: p08-multi

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: INSIDE://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  CLUSTER_ID: klCAuWnLSf2HkOCaR3FOWg
  KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: 3000
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-kafka-health: &kafka-health
  test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
  interval: 5s
  timeout: 10s
  retries: 30

services:
  kafka1:
    image: apache/kafka:3.7.0
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka1:9092
    healthcheck: *kafka-health

  kafka2:
    image: apache/kafka:3.7.0
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka2:9092
    healthcheck: *kafka-health

  kafka3:
    image: apache/kafka:3.7.0
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka3:9092
    healthcheck: *kafka-health

  # Checkpoints are shared by JM and TMs; the volume must be writable by the flink user.
  checkpoints-init:
    image: apache/flink:1.17.1-java11
    user: root
    entrypoint: ["chown", "-R", "flink:flink", "/checkpoints"]
    volumes:
      - checkpoints:/checkpoints

  jobmanager:
    image: apache/flink:1.17.1-java11
    hostname: jobmanager
    command: jobmanager
    ports:
      - "8082:8081"
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1g
        taskmanager.memory.process.size: 1g
        taskmanager.numberOfTaskSlots: 1
        parallelism.default: 3
        execution.checkpointing.interval: 5s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.backend: hashmap
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///checkpoints
        state.checkpoints.num-retained: 5
        pipeline.operator-chaining: false
        restart-strategy.fixed-delay.attempts: 2147483646
        heartbeat.interval: 1000
        heartbeat.timeout: 3000
    healthcheck:
      test: curl -sf localhost:8081/overview
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - checkpoints:/checkpoints
    depends_on:
      checkpoints-init:
        condition: service_completed_successfully
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy

  taskmanager1: &taskmanager
    image: apache/flink:1.17.1-java11
    hostname: taskmanager1
    command: taskmanager
    environment: *flink-env
    volumes:
      - checkpoints:/checkpoints
    depends_on:
      - jobmanager

  taskmanager2:
    <<: *taskmanager
    hostname: taskmanager2

  taskmanager3:
    <<: *taskmanager
    hostname: taskmanager3

  # One-shot: create the SST topics. Every partition must receive events,
  # otherwise the source watermark does not advance.
  topics:
    image: apache/kafka:3.7.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        for t in click output lateOutput; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:9092 --create --if-not-exists \
            --topic $$t --partitions ${PARTITIONS:-3} --replication-factor 3 || exit 1
        done
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy

  # One-shot: submit the author's SST job (-streams 1), or the team's job (app/job)
  # with JOB=own and extra options in JOB_ARGS, with PG=e1|a1, unless a job
  # is already running. All three brokers are listed so losing one keeps bootstrap working.
  submit:
    image: apache/flink:1.17.1-java11
    entrypoint: ["sh", "-c"]
    command:
      - |
        if curl -s jobmanager:8081/jobs/overview | grep -q '"state":"RUNNING"'; then
          echo "job already running, not submitting"; exit 0
        fi
        echo "$$FLINK_PROPERTIES" >> /opt/flink/conf/flink-conf.yaml
        if [ "${JOB:-baseline}" = own ]; then
          flink run -d -m jobmanager:8081 /jobs/job.jar --kafka kafka1:9092,kafka2:9092,kafka3:9092 --pg ${PG:-e1} ${JOB_ARGS:-}
        else
          flink run -d -m jobmanager:8081 --class de.tum.in.msrg.flink.FlinkWrapper /jobs/topology.jar \
            -kafka kafka1:9092,kafka2:9092,kafka3:9092 -streams 1 -pg ${PG:-e1}
        fi
    # Job-level options (checkpointing, chaining) are read by the submitting client;
    # the image entrypoint that applies FLINK_PROPERTIES is bypassed, hence the echo above.
    environment: *flink-env
    volumes:
      - ./target:/jobs:ro
    depends_on:
      topics:
        condition: service_completed_successfully
      jobmanager:
        condition: service_healthy
      taskmanager1:
        condition: service_started
      taskmanager2:
        condition: service_started
      taskmanager3:
        condition: service_started

volumes:
  checkpoints:
